[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multistyle"
version = "0.1.0"
description = "Seven Engines: a seven-style systematic futures programme rebuilt from a 10-K disclosure, tested for its uncorrelated-returns claim."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11", "statsmodels>=0.14",
                "matplotlib>=3.8", "pyyaml>=6", "requests>=2.31", "yfinance>=0.2.40", "qcore", "qengine"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
